# Additive nginx config, included by Dokku's generated vhost (Dokku's
# "custom nginx configuration" mechanism -- files under nginx.conf.d/*.conf at
# the app repo root get pulled into the generated server block on deploy).
# This is NOT a full vhost replacement -- Dokku still owns TLS/proxy_pass/
# upstream wiring; we're only layering buffering/timeout/header tuning on top.
#
# VALIDATE AFTER FIRST DEPLOY: run `dokku nginx:show-config imgproxy` and
# confirm these directives actually landed inside the right context (some
# Dokku versions include this at server-level, some at location-level -- the
# `if ($request_method ...)` block in particular needs a location context to
# be legal nginx, so double check that specifically).
#
# Deliberately NOT present: any proxy_cache* directive. That was the root
# cause of the 2026-07-09 outage (proxy_cache_valid any 0s + use_stale served
# one cached 502 to every client indefinitely) -- see
# showcase memory: imgproxy-502-nginx-cache-incident.md. imgproxy Pro's own
# S3 result cache (IMGPROXY_CACHE_USE) replaces this layer entirely. Do not
# re-add an nginx-level cache here.

if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

add_header X-Content-Type-Options "nosniff"     always;
add_header X-Frame-Options        "DENY"        always;
add_header Referrer-Policy        "no-referrer" always;

proxy_buffering          on;
proxy_buffers            16 256k;
proxy_buffer_size        256k;
proxy_busy_buffers_size  512k;
proxy_max_temp_file_size 0;
proxy_connect_timeout    10s;
proxy_send_timeout       120s;
proxy_read_timeout       120s;

# imgproxy sets its own Cache-Control/Expires on successful responses; hide
# and replace so we don't double up, but crucially DON'T use `always` here --
# without it, nginx only attaches this to 2xx/3xx responses by default, so an
# error response is never told to be cached downstream either.
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_pass_header ETag;
proxy_pass_header Last-Modified;
add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";

# Surfaces imgproxy Pro's own S3 result-cache status (HIT/MISS) for debugging.
add_header X-Cache-Status $upstream_http_x_result_cache always;
