# LOCAL **Pro** stack — the isolated half of the closed-loop mediary test.
#
# Separate from docker-compose.yml on purpose: that file is the documented
# free-image dev stack (darthsim/imgproxy, IMGPROXY_USE_S3=false) and should stay
# that way. This one exists because a local mediary run needs the things only Pro
# does — /info with thumb_hash, blurhash, dominant_colors, detect_objects — and
# needs them against an isolated bucket rather than prod museado.
#
#   docker compose -f docker-compose.pro.yml up -d
#   curl -s localhost:8081/health
#
# Notes:
#  - Port 8081, because 8080 is already taken locally by depot_imgproxy.
#  - IMGPROXY_LICENSE_KEY is deliberately EMPTY. Unlicensed, the Pro image still
#    serves Pro features, rate-limited to ~100 req/min. A 10-record smoke test is
#    nowhere near that, and it keeps the prod licence out of a dev .env.
#  - IMGPROXY_KEY/SALT come from .env and MUST match mediary/.env.local, or every
#    signed URL 403s.
#  - Source bucket is mediary-dev (created 2026-08-20), NOT museado. The whole
#    point is that this test cannot read or write production objects.
#  - No result cache (IMGPROXY_CACHE_USE unset): caching a test run into S3 buys
#    nothing and would leave junk behind.
services:
  imgproxy-pro:
    image: docker.imgproxy.pro/imgproxy:v4.0.12-ml
    container_name: imgproxy_pro_local
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      # Source storage — the isolated bucket.
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: "https://fsn1.your-objectstorage.com"
      IMGPROXY_S3_REGION: "fsn1"
      # Hetzner needs the region to match the endpoint location; without it,
      # CreateBucket/GetObject fail with LocationConstraintConflict.
      AWS_REGION: "fsn1"
      # Fail loudly in dev rather than silently serving a placeholder.
      IMGPROXY_ENFORCE_WEBP: "false"
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: "true"
      # The 5s default is too tight for multi-MB masters pulled over the S3 API while an
      # archive run is uploading on the same link. Measured 2026-08-20 on a fortepan sync:
      # idle, /info on a 2 MB object answers in 0.2s; with the archive worker running, the
      # same request hits "source request timed out: context deadline exceeded" at exactly
      # 5.003s. Those 504s are what stalled asset.info — and a timeout looks identical to a
      # missing object, so it also poisons the "a 404 means an application bug" guarantee
      # that IMGPROXY_ALLOWED_SOURCES is supposed to buy.
      IMGPROXY_DOWNLOAD_TIMEOUT: "30"
      # ...and the OVERALL request budget, which is a separate 10s default and bites next. mediary's
      # /info asks for exif+thumbhash+blurhash+phash+avg+dominant-colours in one call; on a 12 MB
      # fortepan master that is ~10s of decode in the UNLICENSED dev image (2s of which is the S3
      # fetch). Licensed Pro is much faster, so this ceiling is a dev-stack concern, not a
      # production one — but here it is the difference between asset.info draining and stalling.
      IMGPROXY_TIMEOUT: "60"
